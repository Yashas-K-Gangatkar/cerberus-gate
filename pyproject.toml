[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-gate"
version = "3.0.0b4"
description = "Cerberus - the three-headed gate on your AI's only exit: owner veto on egress, tamper-evident ledger, automatic probation."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Cerberus authors" }]
keywords = ["ai", "agents", "safety", "audit", "egress", "gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
cerb = "cerberus_gate.__main__:main"
cerberus = "cerberus_gate.__main__:main"

[tool.setuptools]
packages = ["cerberus_gate", "cerberus_gate.blastshield"]
